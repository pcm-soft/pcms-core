[package]
name = "pcms-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pcms-sdk = { path = "../pcms-sdk" }
allocrs = { path = "../allocrs" }

[[bin]]
name = "pcms-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"